[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "invariant-harness"
version = "0.1.0"
description = "Prompt injection test harness"
requires-python = ">=3.10"
dependencies = [
    "anthropic",
    "fastapi",
    "mistralai",
    "openai",
    "python-dotenv",
    "uvicorn",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
