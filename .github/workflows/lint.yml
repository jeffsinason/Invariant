name: Lint

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  lint:
    name: Ruff + Vulture
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: harness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install ruff==0.15.13 vulture==2.14
      - run: ruff check .
      - run: vulture . vulture_whitelist.py --min-confidence 80
